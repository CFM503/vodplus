# ==============================================================================
# VODPlus 高性能流媒体与反向代理生产级 Nginx 配置
# 适用场景：1000 ~ 10000+ 并发流媒体点播、HLS 切片边缘缓存、API 防刷与加速
# ==============================================================================

# 1. 缓存空间定义 (请确保宿主机挂载高性能 NVMe/SSD 磁盘并配置好目录权限)
# ------------------------------------------------------------------------------
# HLS 视频切片分片缓存区 (TS/M4S/MP4)：100MB 内存索引，50GB 磁盘缓存，7天不访问自动淘汰
proxy_cache_path /var/cache/nginx/hls_cache 
    levels=1:2 
    keys_zone=HLS_CACHE:100m 
    max_size=50g 
    inactive=7d 
    use_temp_path=off;

# API 元数据缓存区：10MB 内存索引，1GB 磁盘缓存，1小时不访问淘汰
proxy_cache_path /var/cache/nginx/api_cache 
    levels=1:2 
    keys_zone=API_CACHE:10m 
    max_size=1g 
    inactive=1h 
    use_temp_path=off;

# 2. 限流与防刷配置 (保护源站与上游 API)
# ------------------------------------------------------------------------------
# 单 IP 播放请求限频
limit_req_zone $binary_remote_addr zone=VOD_REQ_LIMIT:20m rate=30r/s;
# 单 IP 最大并发连接数限制
limit_conn_zone $binary_remote_addr zone=VOD_CONN_LIMIT:20m;

# 3. 上游应用服务定义 (Next.js Node/Docker 服务)
# ------------------------------------------------------------------------------
upstream vodplus_app {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 64; # 保持长连接池，避免高并发下反复 TCP 三次握手
}

server {
    listen 80;
    listen [::]:80;
    server_name vod.yourdomain.com;

    # 强制跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vod.yourdomain.com;

    # SSL 性能优化
    ssl_certificate /etc/nginx/ssl/vod.yourdomain.com.crt;
    ssl_certificate_key /etc/nginx/ssl/vod.yourdomain.com.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # 4. 核心传输 I/O 优化
    # --------------------------------------------------------------------------
    sendfile on;                   # 开启零拷贝高效文件发送
    tcp_nopush on;                 # 配合 sendfile，打包整个 TCP 数据包发送，极大降低网络报文碎片
    tcp_nodelay on;                # 禁用 Nagle 算法，降低实时交互与小包响应延迟
    keepalive_timeout 65;          # 保持长连接超时
    keepalive_requests 10000;      # 单个长连接最大请求数
    reset_timedout_connection on;  # 关闭超时连接释放内存

    # 静态文件句柄缓存
    open_file_cache max=65535 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # 5. Gzip 压缩策略 (严格区分：对文本/JSON/m3u8 启用压缩，对媒体视频流禁用)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        application/json 
        application/javascript 
        application/x-javascript 
        application/vnd.apple.mpegurl 
        application/x-mpegURL 
        image/svg+xml;
    # 媒体流 (ts/mp4/webm) 本身已高度编码压缩，严禁二次 Gzip 消耗 CPU！

    # 6. 全局安全与 CORS 跨域响应头
    # --------------------------------------------------------------------------
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, HEAD' always;
    add_header Access-Control-Allow-Headers 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    add_header Access-Control-Expose-Headers 'Content-Length,Content-Range' always;

    # 7. HLS 视频切片代理缓存路由 (.ts / .m4s)
    # --------------------------------------------------------------------------
    location ~* \.(ts|m4s)$ {
        # 缓存配置
        proxy_cache HLS_CACHE;
        proxy_cache_key $uri;
        # 200 与 206(Range) 响应在边缘节点长期缓存 30 天
        proxy_cache_valid 200 206 30d;
        proxy_cache_valid 404 1m;
        
        # 核心防卡死：缓存锁 (同一分片只允许 1 个请求回源拉取，其余并发请求排队等待本地缓存，防止缓存击穿)
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_lock_age 5s;
        
        # 后端异常/超时平滑降级（使用旧缓存响应）
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
        
        # 客户端强缓存头 (秒为单位: 30天)
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Cache-Status $upstream_cache_status;

        # 代理透传
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 8. HLS 播放清单路由 (.m3u8)
    # --------------------------------------------------------------------------
    location ~* \.m3u8$ {
        proxy_cache HLS_CACHE;
        proxy_cache_key $uri$is_args$args;
        # 点播场景 m3u8 缓存 30 分钟，直播/实时更新场景设为 3 秒或无缓存
        proxy_cache_valid 200 30m;
        proxy_cache_valid 404 5s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Cache-Status $upstream_cache_status;

        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 9. MP4 视频直链与分段切片加载 (Range Request Optimization)
    # --------------------------------------------------------------------------
    location ~* \.(mp4|webm)$ {
        # 采用 slice 模块按 1MB 自动切片缓存，极大加速大视频拖动与起播
        slice 1m;
        proxy_cache HLS_CACHE;
        proxy_cache_key $uri$slice_range;
        proxy_set_header Range $slice_range;
        proxy_cache_valid 200 206 30d;

        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;

        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Cache-Status $upstream_cache_status;

        proxy_pass http://vodplus_app;
    }

    # 10. Next.js API 接口代理与边缘缓存 (/api/vod/*)
    # --------------------------------------------------------------------------
    location /api/vod/ {
        limit_req zone=VOD_REQ_LIMIT burst=20 nodelay;
        limit_conn VOD_CONN_LIMIT 30;

        proxy_cache API_CACHE;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        # 热门查询边缘缓存 5 分钟
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-API-Cache $upstream_cache_status;

        proxy_pass http://vodplus_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # 11. Next.js 前端应用静态资源与 SSR 页面 (/ & /_next/*)
    # --------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://vodplus_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://vodplus_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
